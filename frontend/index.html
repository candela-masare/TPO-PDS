<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copa Mundial 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d1a;
      --card:      #1a1a2e;
      --card2:     #16213e;
      --rojo:      #c0392b;
      --rojo2:     #e74c3c;
      --oro:       #f39c12;
      --texto:     #ecf0f1;
      --gris:      #95a5a6;
      --gris2:     #7f8c8d;
      --verde:     #27ae60;
      --amarillo:  #f1c40f;
      --borde:     #2c3e50;
    }

    body {
      background: var(--bg);
      color: var(--texto);
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, #1a0a0a 0%, #2d0808 50%, #1a0a0a 100%);
      border-bottom: 2px solid var(--rojo);
      padding: 16px 20px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 700px;
      margin: 0 auto;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }
    .header h1 span {
      color: var(--oro);
    }
    .header-sub {
      font-size: 0.75rem;
      color: var(--gris);
      margin-top: 2px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── NAV TABS ── */
    .nav-tabs {
      background: var(--card);
      border-bottom: 1px solid var(--borde);
      display: flex;
      max-width: 700px;
      margin: 0 auto;
    }
    .nav-tab {
      flex: 1;
      padding: 13px 8px;
      background: none;
      border: none;
      color: var(--gris);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 3px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-tab.activo {
      color: var(--oro);
      border-bottom-color: var(--oro);
    }
    .nav-tab:hover:not(.activo) {
      color: var(--texto);
    }

    /* ── CONTENIDO PRINCIPAL ── */
    .main {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 0 80px;
    }
    .seccion { display: none; }
    .seccion.activa { display: block; }

    /* ── SPINNER ── */
    .spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
      color: var(--gris);
      flex-direction: column;
      gap: 14px;
    }
    .spinner::before {
      content: '';
      width: 40px; height: 40px;
      border: 4px solid var(--borde);
      border-top-color: var(--rojo);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CABECERA DE FASE ── */
    .fase-header {
      background: var(--rojo);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 8px;
    }
    .fase-header:first-child { margin-top: 0; }
    .fase-fecha {
      font-size: 0.78rem;
      font-weight: 600;
      color: #ffeaa7;
      text-transform: capitalize;
    }
    .fase-nombre {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── TARJETA DE PARTIDO ── */
    .partido-card {
      background: var(--card);
      border-bottom: 1px solid var(--borde);
      padding: 14px 16px 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .partido-card:hover { background: var(--card2); }

    .partido-equipos {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }
    .equipo-local {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .equipo-visitante {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-end;
    }
    .bandera {
      font-size: 2rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .equipo-info { display: flex; flex-direction: column; gap: 3px; }
    .equipo-nombre {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--texto);
    }
    .equipo-visitante .equipo-info { text-align: right; }

    .marcador-centro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .marcador-score {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .gol-num {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      min-width: 28px;
      text-align: center;
    }
    .marcador-sep {
      font-size: 1.2rem;
      color: var(--gris);
    }
    .marcador-label {
      font-size: 0.6rem;
      color: var(--gris);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .penales-badge {
      font-size: 0.65rem;
      background: var(--rojo);
      color: #fff;
      padding: 2px 6px;
      border-radius: 10px;
      margin-top: 2px;
    }

    .partido-estadio {
      text-align: center;
      font-size: 0.72rem;
      color: var(--gris2);
      margin-top: 8px;
    }
    .partido-badges {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }
    .badge {
      font-size: 0.62rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
    }
    .badge-extra   { background: rgba(243,156,18,0.2); color: var(--oro); border: 1px solid var(--oro); }
    .badge-roja    { background: rgba(231,76,60,0.2);  color: var(--rojo2); border: 1px solid var(--rojo2); }

    /* ── TABLA RANKINGS ── */
    .tabla-ranking {
      width: 100%;
      border-collapse: collapse;
    }
    .tabla-ranking thead tr {
      background: var(--card2);
      border-bottom: 2px solid var(--rojo);
    }
    .tabla-ranking th {
      padding: 10px 8px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gris);
      text-align: center;
    }
    .tabla-ranking th:nth-child(2) { text-align: left; padding-left: 12px; }
    .tabla-ranking td {
      padding: 10px 8px;
      font-size: 0.88rem;
      text-align: center;
      border-bottom: 1px solid var(--borde);
    }
    .tabla-ranking td:nth-child(2) { text-align: left; padding-left: 12px; }
    .tabla-ranking tr:hover td { background: var(--card2); }
    .pos-num {
      font-weight: 700;
      color: var(--gris);
      min-width: 28px;
    }
    .pos-num.top { color: var(--oro); }
    .puntos-cel { font-weight: 700; color: var(--oro); }
    .diff-pos { color: var(--verde); }
    .diff-neg { color: var(--rojo2); }
    .ranking-bandera { margin-right: 8px; }

    /* ── TARJETA EQUIPO ── */
    .equipos-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--borde);
    }
    .equipo-card {
      background: var(--card);
      padding: 18px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .equipo-card:hover { background: var(--card2); }
    .equipo-card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .equipo-card-bandera { font-size: 2.2rem; }
    .equipo-card-nombre {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--texto);
    }
    .equipo-card-stats {
      display: flex;
      gap: 12px;
    }
    .stat-item { display: flex; flex-direction: column; align-items: center; }
    .stat-val  { font-size: 1.1rem; font-weight: 700; color: var(--oro); }
    .stat-lbl  { font-size: 0.6rem; color: var(--gris); text-transform: uppercase; }
    .equipo-card-jugadores {
      font-size: 0.72rem;
      color: var(--gris);
      margin-top: 6px;
    }

    /* ── GOLEADORES ── */
    .goleadores-list { padding: 0; }
    .goleador-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--borde);
      background: var(--card);
    }
    .goleador-row:hover { background: var(--card2); }
    .goleador-pos {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gris);
      text-align: center;
    }
    .goleador-pos.top3 { color: var(--oro); }
    .goleador-nombre { font-size: 0.92rem; font-weight: 600; }
    .goleador-equipo { font-size: 0.75rem; color: var(--gris); margin-top: 2px; }
    .goleador-goles {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--verde);
    }

    /* ── MODAL DETALLE ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      overflow-y: auto;
    }
    .modal-overlay.visible { display: block; }
    .modal-box {
      background: var(--card);
      max-width: 560px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--borde);
    }
    .modal-header {
      background: linear-gradient(135deg, #2d0808, #1a0808);
      padding: 20px 18px 16px;
      border-bottom: 2px solid var(--rojo);
    }
    .modal-fase {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gris);
      margin-bottom: 14px;
    }
    .modal-equipos {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }
    .modal-equipo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .modal-bandera { font-size: 3rem; }
    .modal-nombre  { font-size: 1rem; font-weight: 700; text-align: center; }
    .modal-marcador {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .modal-score {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-gol { font-size: 2.5rem; font-weight: 700; }
    .modal-sep { font-size: 1.5rem; color: var(--gris); }
    .modal-penales { font-size: 0.8rem; color: var(--oro); font-weight: 600; }
    .modal-label { font-size: 0.65rem; color: var(--gris); text-transform: uppercase; letter-spacing: 1px; }
    .modal-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--gris);
    }
    .modal-meta-sep { color: var(--borde); }

    .modal-body { padding: 16px; }

    /* Posesión */
    .posesion-bar { margin-bottom: 18px; }
    .posesion-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--gris);
      margin-bottom: 6px;
    }
    .posesion-label span { font-size: 0.85rem; font-weight: 700; color: var(--texto); }
    .posesion-track {
      height: 8px;
      background: var(--borde);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }
    .posesion-fill-local  { background: var(--rojo);  transition: width 0.6s; }
    .posesion-fill-visit  { background: var(--gris2); transition: width 0.6s; }

    /* Timeline */
    .timeline-titulo {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gris);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--borde);
    }
    .timeline { position: relative; margin-bottom: 18px; }
    .timeline-evento {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(44,62,80,0.5);
    }
    .timeline-min {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--gris);
      min-width: 36px;
      text-align: right;
      flex-shrink: 0;
    }
    .timeline-icono { font-size: 1.1rem; flex-shrink: 0; }
    .timeline-info { flex: 1; }
    .timeline-jugador { font-size: 0.88rem; font-weight: 600; }
    .timeline-equipo  { font-size: 0.72rem; color: var(--gris); }

    /* Resumen */
    .resumen-box {
      background: var(--card2);
      border-left: 3px solid var(--rojo);
      padding: 12px 14px;
      border-radius: 4px;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--gris);
    }

    .modal-cerrar-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--borde);
      border: none;
      color: var(--texto);
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .modal-cerrar-btn:hover { background: var(--rojo); }

    .seccion-titulo {
      padding: 14px 16px 10px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gris);
      border-bottom: 1px solid var(--borde);
      background: var(--card2);
    }
    .error-msg {
      padding: 30px 20px;
      text-align: center;
      color: var(--rojo2);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1>Copa Mundial <span>2026</span></h1>
    <div class="header-sub">Plataforma Deportiva · Octavos → Final</div>
  </div>
</div>

<nav>
  <div class="nav-tabs">
    <button class="nav-tab activo" onclick="cambiarTab('partidos')">⚽ Partidos</button>
    <button class="nav-tab" onclick="cambiarTab('equipos')">🏆 Equipos</button>
    <button class="nav-tab" onclick="cambiarTab('rankings')">📊 Rankings</button>
    <button class="nav-tab" onclick="cambiarTab('goleadores')">🥅 Goleadores</button>
  </div>
</nav>

<main class="main">
  <section id="sec-partidos" class="seccion activa">
    <div class="spinner">Cargando partidos...</div>
  </section>
  <section id="sec-equipos" class="seccion">
    <div class="spinner">Cargando equipos...</div>
  </section>
  <section id="sec-rankings" class="seccion">
    <div class="spinner">Cargando rankings...</div>
  </section>
  <section id="sec-goleadores" class="seccion">
    <div class="spinner">Cargando goleadores...</div>
  </section>
</main>

<!-- MODAL -->
<div id="modal" class="modal-overlay" onclick="cerrarModal(event)">
  <div class="modal-box" id="modal-box"></div>
</div>

<script>
const API = 'http://localhost:8080/api';

const BANDERAS = {
  'Argentina':'🇦🇷','México':'🇲🇽','Brasil':'🇧🇷','Uruguay':'🇺🇾',
  'Francia':'🇫🇷','Dinamarca':'🇩🇰','España':'🇪🇸','Croacia':'🇭🇷',
  'Portugal':'🇵🇹','Bélgica':'🇧🇪','Inglaterra':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','Estados Unidos':'🇺🇸',
  'Alemania':'🇩🇪','Japón':'🇯🇵','Países Bajos':'🇳🇱','Italia':'🇮🇹'
};

function bandera(nombre) {
  return BANDERAS[nombre] || '🏳';
}

const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
               'agosto','septiembre','octubre','noviembre','diciembre'];

function formatFecha(str) {
  if (!str) return '';
  const [d, m, y] = str.split('/');
  const fecha = new Date(+y, +m - 1, +d);
  return `${DIAS[fecha.getDay()]}, ${d} de ${MESES[+m - 1]} de ${y}`;
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── TABS ──
const TABS = ['partidos','equipos','rankings','goleadores'];
const cargado = {};

function cambiarTab(tab) {
  TABS.forEach(t => {
    document.getElementById('sec-' + t).classList.toggle('activa', t === tab);
    document.querySelectorAll('.nav-tab').forEach((btn, i) => {
      btn.classList.toggle('activo', TABS[i] === tab);
    });
  });
  if (!cargado[tab]) { cargado[tab] = true; cargarSeccion(tab); }
}

function cargarSeccion(tab) {
  if (tab === 'partidos')   cargarPartidos();
  if (tab === 'equipos')    cargarEquipos();
  if (tab === 'rankings')   cargarRankings();
  if (tab === 'goleadores') cargarGoleadores();
}

// ── PARTIDOS ──
async function cargarPartidos() {
  const sec = document.getElementById('sec-partidos');
  try {
    const partidos = await fetchJSON(API + '/partidos');
    const porFase = {};
    const ordenFase = ['OCTAVOS DE FINAL','CUARTOS DE FINAL','SEMIFINALES','FINAL'];

    for (const p of partidos) {
      if (!porFase[p.fase]) porFase[p.fase] = { fecha: p.fecha, partidos: [] };
      porFase[p.fase].partidos.push(p);
    }

    let html = '';
    for (const fase of ordenFase) {
      const grupo = porFase[fase];
      if (!grupo) continue;
      const fechaMostrar = grupo.partidos.length > 1
        ? formatFecha(grupo.partidos[0].fecha) + ' - ' + formatFecha(grupo.partidos[grupo.partidos.length-1].fecha)
        : formatFecha(grupo.partidos[0].fecha);

      html += `<div class="fase-header">
        <div class="fase-fecha">${fechaMostrar}</div>
        <div class="fase-nombre">${fase}</div>
      </div>`;

      for (const p of grupo.partidos) {
        const info = parsarResultado(p.resultado);
        const badgeExtra = p.huboTiempoExtra ? `<span class="badge badge-extra">⏱ Prórroga</span>` : '';
        const badgeRoja  = p.huboRoja ? `<span class="badge badge-roja">🟥 Roja</span>` : '';
        const penalesHtml = info.penales
          ? `<div class="penales-badge">Pen: ${info.penalesLocal} - ${info.penalesVisitante}</div>`
          : '';

        html += `<div class="partido-card" onclick="abrirDetalle(${p.id})">
          <div class="partido-equipos">
            <div class="equipo-local">
              <span class="bandera">${bandera(p.local)}</span>
              <div class="equipo-info">
                <span class="equipo-nombre">${p.local}</span>
              </div>
            </div>
            <div class="marcador-centro">
              <div class="marcador-score">
                <span class="gol-num">${info.golesLocal}</span>
                <span class="marcador-sep">·</span>
                <span class="gol-num">${info.golesVisitante}</span>
              </div>
              <div class="marcador-label">Puntuación final</div>
              ${penalesHtml}
            </div>
            <div class="equipo-visitante">
              <div class="equipo-info">
                <span class="equipo-nombre">${p.visitante}</span>
              </div>
              <span class="bandera">${bandera(p.visitante)}</span>
            </div>
          </div>
          <div class="partido-estadio">🏟️ ${p.estadio}</div>
          ${(badgeExtra || badgeRoja) ? `<div class="partido-badges">${badgeExtra}${badgeRoja}</div>` : ''}
        </div>`;
      }
    }
    sec.innerHTML = html;
  } catch (e) {
    sec.innerHTML = `<div class="error-msg">Error al cargar partidos: ${e.message}</div>`;
  }
}

function parsarResultado(res) {
  if (!res) return { golesLocal: 0, golesVisitante: 0, penales: false };
  const regPen = /(\d+)\s*\((\d+)\)\s*-\s*\((\d+)\)\s*(\d+)/;
  const mPen = res.match(regPen);
  if (mPen) {
    return { golesLocal: +mPen[1], penalesLocal: +mPen[2], penalesVisitante: +mPen[3], golesVisitante: +mPen[4], penales: true };
  }
  const regNorm = /(\d+)\s*-\s*(\d+)/;
  const mNorm = res.match(regNorm);
  if (mNorm) return { golesLocal: +mNorm[1], golesVisitante: +mNorm[2], penales: false };
  return { golesLocal: 0, golesVisitante: 0, penales: false };
}

// ── DETALLE PARTIDO ──
async function abrirDetalle(id) {
  const modal = document.getElementById('modal');
  const box   = document.getElementById('modal-box');
  box.innerHTML = '<div class="spinner" style="padding:40px">Cargando...</div>';
  modal.classList.add('visible');
  document.body.style.overflow = 'hidden';

  try {
    const p = await fetchJSON(API + '/partidos/' + id);
    const info = parsarResultado(p.resultado);

    // Combinar goles + tarjetas en timeline
    const timeline = [
      ...p.goles.map(g => ({ ...g, tipo: 'GOL' })),
      ...p.tarjetas.map(t => ({ ...t }))
    ].sort((a, b) => a.minuto - b.minuto);

    const iconoEvento = (ev) => {
      if (ev.tipo === 'GOL') return '⚽';
      if (ev.tipo === 'AMARILLA') return '🟨';
      if (ev.tipo === 'ROJA') return '🟥';
      return '🎯';
    };

    const timelineHtml = timeline.map(ev => `
      <div class="timeline-evento">
        <span class="timeline-min">${ev.minuto}'</span>
        <span class="timeline-icono">${iconoEvento(ev)}</span>
        <div class="timeline-info">
          <div class="timeline-jugador">${ev.jugador || '—'}</div>
          <div class="timeline-equipo">${ev.equipo || ''}</div>
        </div>
      </div>
    `).join('');

    const penalesHtml = info.penales
      ? `<div class="modal-penales">Penales: ${info.penalesLocal} - ${info.penalesVisitante}</div>`
      : '';

    const resumenHtml = p.resumen
      ? `<div class="timeline-titulo" style="margin-top:18px">Resumen periodístico</div>
         <div class="resumen-box">${p.resumen}</div>`
      : '';

    box.innerHTML = `
      <div class="modal-header">
        <div class="modal-fase">${p.fase}</div>
        <div class="modal-equipos">
          <div class="modal-equipo">
            <div class="modal-bandera">${bandera(p.local)}</div>
            <div class="modal-nombre">${p.local}</div>
          </div>
          <div class="modal-marcador">
            <div class="modal-score">
              <span class="modal-gol">${info.golesLocal}</span>
              <span class="modal-sep">-</span>
              <span class="modal-gol">${info.golesVisitante}</span>
            </div>
            ${penalesHtml}
            <div class="modal-label">Resultado final</div>
          </div>
          <div class="modal-equipo">
            <div class="modal-bandera">${bandera(p.visitante)}</div>
            <div class="modal-nombre">${p.visitante}</div>
          </div>
        </div>
        <div class="modal-meta">
          📅 ${formatFecha(p.fecha)}
          <span class="modal-meta-sep">|</span>
          🏟️ ${p.estadio}
        </div>
      </div>
      <div class="modal-body">
        <div class="posesion-bar">
          <div class="posesion-label">
            <div>${bandera(p.local)} <span>${p.posesionLocal}%</span> Posesión</div>
            <div>Posesión <span>${p.posesionVisitante}%</span> ${bandera(p.visitante)}</div>
          </div>
          <div class="posesion-track">
            <div class="posesion-fill-local"  style="width:${p.posesionLocal}%"></div>
            <div class="posesion-fill-visit"  style="width:${p.posesionVisitante}%"></div>
          </div>
        </div>
        <div class="timeline-titulo">Línea de tiempo</div>
        <div class="timeline">
          ${timelineHtml || '<div style="color:var(--gris);font-size:0.85rem;padding:8px 0">Sin eventos registrados</div>'}
        </div>
        ${resumenHtml}
      </div>
      <button class="modal-cerrar-btn" onclick="cerrarModal()">✕ Cerrar</button>
    `;
  } catch (e) {
    box.innerHTML = `<div class="error-msg">Error: ${e.message}</div>
      <button class="modal-cerrar-btn" onclick="cerrarModal()">✕ Cerrar</button>`;
  }
}

function cerrarModal(evt) {
  if (evt && evt.target !== document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('visible');
  document.body.style.overflow = '';
}

// ── EQUIPOS ──
async function cargarEquipos() {
  const sec = document.getElementById('sec-equipos');
  try {
    const equipos = await fetchJSON(API + '/equipos');
    let html = '<div class="seccion-titulo">Seleccionados — Copa Mundial 2026</div>';
    html += '<div class="equipos-grid">';
    for (const e of equipos) {
      const diff = e.diferencia >= 0 ? '+' + e.diferencia : e.diferencia;
      const diffClass = e.diferencia >= 0 ? 'diff-pos' : 'diff-neg';
      html += `<div class="equipo-card" onclick="abrirEquipo('${encodeURIComponent(e.clave)}')">
        <div class="equipo-card-top">
          <span class="equipo-card-bandera">${bandera(e.nombre)}</span>
          <span class="equipo-card-nombre">${e.nombre}</span>
        </div>
        <div class="equipo-card-stats">
          <div class="stat-item"><span class="stat-val">${e.puntos}</span><span class="stat-lbl">Pts</span></div>
          <div class="stat-item"><span class="stat-val">${e.golesAFavor}</span><span class="stat-lbl">GF</span></div>
          <div class="stat-item"><span class="stat-val">${e.golesEnContra}</span><span class="stat-lbl">GC</span></div>
          <div class="stat-item"><span class="stat-val ${diffClass}">${diff}</span><span class="stat-lbl">DG</span></div>
        </div>
        <div class="equipo-card-jugadores">👥 ${e.cantidadJugadores} jugadores</div>
      </div>`;
    }
    html += '</div>';
    sec.innerHTML = html;
  } catch (e) {
    sec.innerHTML = `<div class="error-msg">Error: ${e.message}</div>`;
  }
}

async function abrirEquipo(claveEnc) {
  const clave = decodeURIComponent(claveEnc);
  const modal = document.getElementById('modal');
  const box   = document.getElementById('modal-box');
  box.innerHTML = '<div class="spinner" style="padding:40px">Cargando...</div>';
  modal.classList.add('visible');
  document.body.style.overflow = 'hidden';

  try {
    const eq = await fetchJSON(API + '/equipos/' + claveEnc);
    const diff = eq.diferencia >= 0 ? '+' + eq.diferencia : eq.diferencia;
    const diffClass = eq.diferencia >= 0 ? 'diff-pos' : 'diff-neg';

    const posiciones = {};
    for (const j of eq.jugadores) {
      if (!posiciones[j.posicion]) posiciones[j.posicion] = [];
      posiciones[j.posicion].push(j);
    }

    let jugadoresHtml = '';
    for (const pos of Object.keys(posiciones)) {
      jugadoresHtml += `<div class="timeline-titulo" style="margin-top:14px">${pos}</div>`;
      for (const j of posiciones[pos]) {
        const golesIcon = j.goles > 0 ? `⚽ ${j.goles}` : '';
        const amIcon = j.tarjetasAmarillas > 0 ? ` 🟨 ${j.tarjetasAmarillas}` : '';
        const rojaIcon = j.tarjetasRojas > 0 ? ` 🟥 ${j.tarjetasRojas}` : '';
        jugadoresHtml += `<div class="timeline-evento">
          <span class="timeline-jugador">${j.nombre}</span>
          <span style="color:var(--gris);font-size:0.75rem;margin-left:auto">${golesIcon}${amIcon}${rojaIcon}</span>
        </div>`;
      }
    }

    box.innerHTML = `
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
          <span style="font-size:3.5rem">${bandera(eq.nombre)}</span>
          <div>
            <div style="font-size:1.4rem;font-weight:700">${eq.nombre}</div>
            <div style="font-size:0.75rem;color:var(--gris)">Fundación: ${eq.anioFundacion || 'N/A'}</div>
          </div>
        </div>
        <div style="display:flex;gap:20px;justify-content:center">
          <div class="stat-item"><span class="stat-val">${eq.puntos}</span><span class="stat-lbl">Puntos</span></div>
          <div class="stat-item"><span class="stat-val">${eq.golesAFavor}</span><span class="stat-lbl">Goles F.</span></div>
          <div class="stat-item"><span class="stat-val">${eq.golesEnContra}</span><span class="stat-lbl">Goles C.</span></div>
          <div class="stat-item"><span class="stat-val ${diffClass}">${diff}</span><span class="stat-lbl">Diferencia</span></div>
          <div class="stat-item"><span class="stat-val">${eq.jugadores.length}</span><span class="stat-lbl">Jugadores</span></div>
        </div>
      </div>
      <div class="modal-body">
        <div class="timeline-titulo">Plantilla</div>
        <div class="timeline">${jugadoresHtml}</div>
      </div>
      <button class="modal-cerrar-btn" onclick="cerrarModal()">✕ Cerrar</button>
    `;
  } catch (e) {
    box.innerHTML = `<div class="error-msg">Error: ${e.message}</div>
      <button class="modal-cerrar-btn" onclick="cerrarModal()">✕ Cerrar</button>`;
  }
}

// ── RANKINGS ──
async function cargarRankings() {
  const sec = document.getElementById('sec-rankings');
  try {
    const rankings = await fetchJSON(API + '/rankings');
    let html = `
      <div class="seccion-titulo">Tabla de posiciones — por puntos</div>
      <table class="tabla-ranking">
        <thead>
          <tr>
            <th>#</th>
            <th>Equipo</th>
            <th>Pts</th>
            <th>GF</th>
            <th>GC</th>
            <th>DG</th>
          </tr>
        </thead>
        <tbody>
    `;
    for (const r of rankings) {
      const posClass = r.posicion <= 3 ? 'top3 top' : '';
      const diff = r.diferencia >= 0 ? '+' + r.diferencia : r.diferencia;
      const diffClass = r.diferencia >= 0 ? 'diff-pos' : 'diff-neg';
      html += `<tr>
        <td><span class="pos-num ${posClass}">${r.posicion}</span></td>
        <td><span class="ranking-bandera">${bandera(r.nombre)}</span>${r.nombre}</td>
        <td><span class="puntos-cel">${r.puntos}</span></td>
        <td>${r.golesAFavor}</td>
        <td>${r.golesEnContra}</td>
        <td class="${diffClass}">${diff}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    sec.innerHTML = html;
  } catch (e) {
    sec.innerHTML = `<div class="error-msg">Error: ${e.message}</div>`;
  }
}

// ── GOLEADORES ──
async function cargarGoleadores() {
  const sec = document.getElementById('sec-goleadores');
  try {
    const goleadores = await fetchJSON(API + '/goleadores');
    let html = '<div class="seccion-titulo">Tabla de goleadores — Copa Mundial 2026</div>';
    html += '<div class="goleadores-list">';
    for (const g of goleadores) {
      const posClass = g.posicion <= 3 ? 'top3' : '';
      const medal = g.posicion === 1 ? '🥇' : g.posicion === 2 ? '🥈' : g.posicion === 3 ? '🥉' : g.posicion;
      html += `<div class="goleador-row">
        <div class="goleador-pos ${posClass}">${medal}</div>
        <div>
          <div class="goleador-nombre">${g.jugador}</div>
          <div class="goleador-equipo">${bandera(g.equipo)} ${g.equipo}</div>
        </div>
        <div class="goleador-goles">${g.goles}</div>
      </div>`;
    }
    html += '</div>';
    sec.innerHTML = html;
  } catch (e) {
    sec.innerHTML = `<div class="error-msg">Error: ${e.message}</div>`;
  }
}
